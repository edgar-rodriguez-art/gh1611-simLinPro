name: Actualizar métricas de España

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-metrics.mjs
      - name: Commit si cambió
        run: |
          if git diff --quiet -- data/metrics.json; then
            echo "Sin cambios en data/metrics.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git commit -m "datos: actualizar métricas de España ($(date -u +%F))"
          git push
